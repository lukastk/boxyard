name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.14 is what `uv tool install boxyard` actually picks, so it is
        # what the tool RUNS on. Testing only 3.11/3.12 let a fault ship that
        # is deprecated in 3.12 and RAISES in 3.14
        # (`asyncio.get_event_loop()`, fixed in v0.5.5) -- green on every
        # version CI tested. Test the floor and the deployed version, and 3.13
        # in between.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install rclone
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install rclone
          else
            sudo apt-get update && sudo apt-get install -y rclone
          fi

      - name: Run tests
        run: uv run pytest -v -m "not integration"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src/boxyard

  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    # The Go port lives on feat/go-rewrite, which forked before this job
    # existed; the `if` keeps the job from failing on branches with no Go tree
    # rather than making every one of them carry a stub.
    steps:
      - uses: actions/checkout@v4

      - name: Is there a Go tree on this ref?
        id: detect
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version: '1.24'

      - name: go vet
        if: steps.detect.outputs.present == 'true'
        run: go vet ./...

      - name: gofmt
        if: steps.detect.outputs.present == 'true'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go test
        # ./internal/... only: the parity suite needs the installed Python
        # boxyard and the real storage box, neither of which exists in CI. A
        # differential that silently SKIPS in CI is worse than one that is not
        # run there, because the skip reads as a pass.
        if: steps.detect.outputs.present == 'true'
        run: go test -race ./internal/...
