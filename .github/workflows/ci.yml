name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.14 is what `uv tool install boxyard` actually picks, so it is
        # what the tool RUNS on. Testing only 3.11/3.12 let a fault ship that
        # is deprecated in 3.12 and RAISES in 3.14
        # (`asyncio.get_event_loop()`, fixed in v0.5.5) -- green on every
        # version CI tested. Test the floor and the deployed version, and 3.13
        # in between.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install rclone
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install rclone
          else
            sudo apt-get update && sudo apt-get install -y rclone
          fi

      - name: Run tests
        run: uv run pytest -v -m "not integration"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src/boxyard
